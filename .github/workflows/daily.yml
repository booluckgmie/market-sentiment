name: Daily Trend Radar refresh

on:
  schedule:
    # GitHub often delays or drops scheduled runs, so the main run is followed by two backups.
    # The later two are backups: the "gate" job skips them when today's refresh already happened.
    - cron: "30 23 * * *"   # 07:30 Malaysia time (UTC+8)
    - cron: "50 0 * * *"    # 08:50 Malaysia time (backup)
    - cron: "20 4 * * *"    # 12:20 Malaysia time (backup)
  workflow_dispatch:        # lets you run it by hand from the Actions tab (always runs)

permissions:
  contents: write           # needed to commit the refreshed page back to this branch

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    # Decides whether today's (Malaysia date) refresh still needs to happen, so backup schedules never double-post.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30
      - id: g
        run: |
          today=$(TZ=Asia/Kuala_Lumpur date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run=true
          elif git log -n 30 --format=%s | grep -q "^Daily refresh $today"; then run=false
          else run=true; fi
          echo "Malaysia date $today -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keeps the news and Trends caches between runs so each day only fetches what is new.
      - name: Restore data cache
        uses: actions/cache@v6
        with:
          path: |
            cache.json
            trends_cache.json
          key: radar-cache-${{ github.run_id }}
          restore-keys: |
            radar-cache-

      - name: Build the page
        run: python refresh.py --out index.html --data-out brief/data.json

      # Vercel deploys whatever lands on this branch, so commit the refreshed page straight back to it.
      - name: Commit the refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "Daily refresh $(TZ=Asia/Kuala_Lumpur date +%F)"
            for i in 1 2 3; do
              git pull -q --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push attempt $i failed, retrying"; sleep 5
            done
          fi

      # Hands the raw data to the Telegram job below.
      - uses: actions/upload-artifact@v7
        with:
          name: brief-data
          path: brief/data.json

  notify:
    # Sends the daily brief to Telegram. Does nothing (and does not fail) until you add the two secrets.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGE_URL: ${{ vars.PAGE_URL }}                    # your Vercel address, e.g. https://market-sentiment.vercel.app
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'en' }}      # en, ms or both
      NOTIFY_SCOPE: ${{ vars.NOTIFY_SCOPE || 'both' }}  # both, my or gl
      NOTIFY_IMAGE: ${{ vars.NOTIFY_IMAGE || '1' }}      # 0 = text only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install notifier dependencies
        run: |
          pip install requests pillow
          sudo apt-get install -y fonts-dejavu-core || true
      - uses: actions/download-artifact@v8
        with:
          name: brief-data
          path: brief
      - name: Send Telegram brief
        run: python notify.py --data brief/data.json

  alert:
    # If the build fails, tell you on Telegram instead of failing silently. Needs the same two secrets.
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure notice
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "Telegram not configured"; exit 0; fi
          curl -sS -o /dev/null "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ Trend Radar refresh failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
